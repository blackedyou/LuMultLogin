name: Auto-login-Lunes

on:
  workflow_dispatch:            # 手动触发
  schedule:
    # ⚠️ cron 只认 UTC：北京时间 = UTC + 8
    # 每天 UTC 00:00 触发一次，脚本内部判断是否已满 10 天 + 随机延迟，实现每 10 天随机时间运行
    - cron: '0 0 * * *'

jobs:
  Renew-lunes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write           # time.txt 提交推送需要
      # actions: write          # 已不需要删除运行记录，可去掉
    steps:
      - name: 📥 下载代码
        uses: actions/checkout@v6

      - name: 🐍 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖和Python依赖
        run: |
          sudo apt-get update
          sudo apt-get install xvfb x11-utils xdotool scrot fonts-noto-cjk -y
          pip install seleniumbase aiohttp requests
          seleniumbase install chromedriver

      - name: ⏱️ 检查是否已满 10 天 + 随机延迟
        id: check
        run: |
          # 读取上次运行时间（time.txt 格式：YYYY-MM-DD HH:MM:SS，上海时区）
          if [ -f time.txt ]; then
            LAST=$(cat time.txt)
            LAST_TS=$(date -d "$LAST" +%s 2>/dev/null || echo 0)
          else
            LAST_TS=0
          fi

          NOW_TS=$(date +%s)
          DIFF_DAYS=$(( (NOW_TS - LAST_TS) / 86400 ))

          echo "上次运行时间: ${LAST:-无记录}"
          echo "距今天数: $DIFF_DAYS"

          if [ "$DIFF_DAYS" -lt 10 ]; then
            echo "未满 10 天，跳过本次运行"
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 已满 10 天，随机延迟 0~23 小时 + 0~59 分钟，实现当天随机时间
          RANDOM_HOUR=$((RANDOM % 24))
          RANDOM_MIN=$((RANDOM % 60))
          SLEEP_SEC=$((RANDOM_HOUR * 3600 + RANDOM_MIN * 60))
          echo "已满 10 天，随机延迟 ${RANDOM_HOUR}小时${RANDOM_MIN}分钟 (共 ${SLEEP_SEC} 秒)"
          sleep $SLEEP_SEC
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: 🌐 设置sing-box代理转发
        if: steps.check.outputs.should_run == 'true'
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}   # 在 secret 里设置 NODE_LINK 代理启用代理
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        if: steps.check.outputs.should_run == 'true'
        env:
          LUNES_EMAIL: ${{ secrets.LUNES_EMAIL }}
          LUNES_PASSWORD: ${{ secrets.LUNES_PASSWORD }}
          LUNES_EMAIL1: ${{ secrets.LUNES_EMAIL1 }}       # 账号2（可选，不配则自动跳过）
          LUNES_PASSWORD1: ${{ secrets.LUNES_PASSWORD1 }} # 账号2 密码
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py

      # 更新时间到 time.txt，避免仓库长期无活动导致 schedule 被自动停用
      # （60 天无活动自动禁用只针对 public 仓库；private 仓库无此限制）
      - name: 更新时间
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main || true
            git push origin main
          fi
